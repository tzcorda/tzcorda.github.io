<style>
    .definition {
        visibility: hidden;
        width: 12rem; /* 120px */
        background-color: #555; /* bg-gray-700 in Tailwind */
        color: #fff; /* text-white in Tailwind */
        text-align: center;
        border-radius: 0.375rem; /* rounded in Tailwind */
        padding: 0.5rem 0; /* py-2 in Tailwind */
        position: absolute;
        z-index: 10;
        bottom: 125%;
        left: 50%;
        margin-left: -6rem; /* -60px */
        opacity: 0;
        transition: opacity 0.3s;
        font-size: 1rem; /* Customize font size */
        font-family: Verdana, Geneva, Tahoma, sans-serif; /* Customize font family */
    }
    
    .term {
        position: relative;
        display: inline-block;
        border-bottom: none 1px dotted black;
    }
    
    .term:hover .definition {
        visibility: visible;
        opacity: 0.8;
    }
</style>
<span class="term">
    {{ .Inner }}
    <span class="definition">
        {{ .Get "title" }}
    </span>
</span>
