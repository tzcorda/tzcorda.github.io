<div class="spoiler-container">
    <button class="spoiler-toggle">{{ .Get "text" }}</button>
    <div class="spoiler-body" style="display: none; color: blue; font-size: 16px;">
      {{ .Inner }}
    </div>
  </div>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var toggles = document.querySelectorAll('.spoiler-toggle');
      toggles.forEach(function(toggle) {
        toggle.addEventListener('click', function() {
          var body = this.nextElementSibling;
          if (body.style.display === 'none') {
            body.style.display = 'block';
          } else {
            body.style.display = 'none';
          }
        });
      });
    });
  </script>
  
  <style>
  .spoiler-toggle {
    color: red; /* Customize the toggle text color */
    font-size: 18px; /* Customize the toggle text size */
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    text-decoration: underline;
  }
  
  .spoiler-body {
    margin-top: 10px;
  }
  </style>
