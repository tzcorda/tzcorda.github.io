# ---------- journal articles ----------

- id: 1
  title: "Beyond Recipient Needs and Donor Self-Interests: Third-Kind Relational Drivers of Italy's Aid Policy in Africa"
  title_short: "Relational Drivers of Italy's Aid in Africa"
  type: academic-peer-review
  year: 2026
  year_display: "2026"
  portfolio: [africa, diplomacy, pressure]
  venue: "Journal of Development Studies"
  coauthors: "G. Carbone and C. Mella"
  blurb: >
    Tests relational drivers of Italy's bilateral aid to African countries.
    Italy gives more where donor competition is high, especially in large aid
    markets, and to countries whose leaders make high-level visits to Rome.
  url: https://doi.org/10.1080/00220388.2026.2689337

- id: 2
  title: "Even sovereignist rulers need foreign friends: how political leaders in Africa design external engagement for domestic legitimacy"
  title_short: "Even Sovereignist Rulers Need Foreign Friends"
  type: academic-peer-review
  year: 2026
  year_display: "2026"
  portfolio: [authoritarianism, africa, diplomacy]
  venue: "Third World Quarterly"
  coauthors: "M. Casiraghi"
  blurb: >
    Uses original data on African leaders' diplomatic visits in 1990-2022 to
    show that sovereignist leaders do not cut external engagement. They move
    away from former colonial powers while keeping ties with other advanced
    economies and emerging powers.
  url: https://doi.org/10.1080/01436597.2026.2672508

- id: 3
  title: "Countering autocratization from the outside: evidence from Africa"
  title_short: "Countering Autocratization from the Outside"
  type: academic-peer-review
  year: 2026
  year_display: "2026"
  portfolio: [authoritarianism, pressure, africa]
  venue: "Democratization"
  coauthors: "A. Cassani"
  blurb: >
    Examines autocratization episodes in Africa in 2000-2023 and finds that
    external actors help counter them when democracy sanctions come with
    substantial increases in democracy aid.
  url: https://doi.org/10.1080/13510347.2026.2640037

- id: 4
  title: "In-Group We Trust, No More? How Senders' Legitimacy Shapes the Success of Sanctions-Based Democracy Promotion"
  title_short: "In-Group We Trust, No More?"
  type: academic-peer-review
  year: 2026
  year_display: "2026"
  portfolio: [pressure, authoritarianism, africa]
  venue: "Cooperation and Conflict"
  blurb: >
    Compares democracy sanctions by regional and extra-regional senders in
    Africa since the 1990s. Sanctions involving regional organizations succeed
    more often, but in-group legitimacy can erode and rarely brings democratic
    deepening.
  url: https://doi.org/10.1177/00108367241298929

- id: 5
  title: "The party politics of diplomatic engagements: Evidence from Italy"
  title_short: "Party Politics of Diplomatic Engagements"
  type: academic-peer-review
  year: 2025
  year_display: "2025"
  portfolio: [diplomacy, authoritarianism]
  venue: "Italian Political Science Review"
  coauthors: "M. Casiraghi"
  blurb: >
    Uses a new dataset of Italy's high-level bilateral visits in 2000-2023 to
    show that partisanship shapes how often governments engage abroad and with
    whom. Right-wing governments are more likely to engage authoritarian
    regimes than democracies.
  url: https://doi.org/10.1017/ipo.2024.30

- id: 6
  title: "For things to remain the same, how many things have to change? Elite continuity and change after leadership changes"
  title_short: "Elite Continuity and Change after Leadership Changes"
  type: academic-peer-review
  year: 2023
  year_display: "2023"
  portfolio: [authoritarianism, africa]
  venue: "Democratization"
  blurb: >
    Uses original data on African cabinets to study how leaders who take
    office through neither elections nor violence reshape their elites. A
    comparison of Ethiopia and Zimbabwe shows how the timing and sequencing of
    these changes affect leadership stability.
  url: https://doi.org/10.1080/13510347.2023.2189699

- id: 7
  title: "Constraining compliance? Reconsidering the effect of domestic veto players on sanctions success"
  title_short: "Veto Players and Sanctions Success"
  type: academic-peer-review
  year: 2023
  year_display: "2023"
  portfolio: [pressure]
  venue: "Defence and Peace Economics"
  blurb: >
    Argues that diverging policy preferences among a target country's veto
    players hinder compliance with sanctions. A reassessment with Tsebelis'
    policy-area-specific veto player data confirms this negative effect.
  url: https://doi.org/10.1080/10242694.2022.2158288

- id: 8
  title: "Recovering Regional Power: The Islamic Republic under Rouhani's Presidency"
  title_short: "Iran under Rouhani's Presidency"
  type: academic-peer-review
  year: 2016
  year_display: "2016"
  portfolio: [pressure, diplomacy]
  venue: "Il Politico: Rivista Italiana di Scienze Politiche"
  blurb: >
    On Iran's attempt to recover regional power under Rouhani's presidency,
    against the backdrop of economic sanctions and the nuclear negotiations.
  url: https://doi.org/10.1400/256134

